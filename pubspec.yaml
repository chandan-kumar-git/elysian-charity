name: flutter_app
description: A blockchain charity donation platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  web3dart: ^2.7.3
  http: ^1.2.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  fl_chart: ^0.66.2
  google_sign_in: ^6.3.0
  audioplayers: ^6.1.0
  device_info_plus: ^11.5.0
  intl: ^0.19.0
  wallet: ^0.0.13
  bip39: ^1.0.6
  ed25519_hd_key: ^2.2.1
  hex: ^0.2.0
  vibration: ^2.1.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/animations/
    - assets/models/
